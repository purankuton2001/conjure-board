name: Takedown request
description: Ask for a Board or Gallery entry to be removed.
title: "takedown: "
labels: [takedown]
body:
  - type: input
    id: entry
    attributes: { label: Board entry, description: "Streamer and idol name as shown on the site" }
    validations: { required: true }
  - type: textarea
    id: reason
    attributes: { label: Reason }
    validations: { required: true }
  - type: markdown
    attributes:
      value: Entries suspected of using a real person or an existing character are removed first and discussed after.
